name: GreenFix Backend CI

on:
  push:
    branches: [ "main", "feature/Frontend" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Cambia a '9.0.x' si tu proyecto usa .NET 9

    - name: Restaurar dependencias (NuGet)
      run: dotnet restore backend/backend.csproj

    - name: Compilar el proyecto en la nube
      run: dotnet build backend/backend.csproj --no-restore --configuration Release
